[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edqsg"
version = "0.6.0"
description = "EDQSG评价内核、SQL Server只读自动分析与论文图可视化"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "EDQSG Research Team"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
sqlserver = ["SQLAlchemy>=2.0", "pyodbc>=5.0"]
yaml = ["PyYAML>=6.0"]
visualization = ["matplotlib>=3.8"]
all = ["SQLAlchemy>=2.0", "pyodbc>=5.0", "PyYAML>=6.0", "matplotlib>=3.8"]

[project.scripts]
edqsg-demo = "edqsg.__main__:main"
edqsg-sqlserver = "edqsg.sqlserver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
